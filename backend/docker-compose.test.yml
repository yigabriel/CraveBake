# Throwaway Postgres for the integration tests (never the real database).
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://cravebake:cravebake@localhost:55432/cravebake_test pytest -m integration
#
# Data lives in tmpfs: it disappears when the container stops.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cravebake
      POSTGRES_PASSWORD: cravebake
      POSTGRES_DB: cravebake_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cravebake -d cravebake_test"]
      interval: 2s
      timeout: 3s
      retries: 15
