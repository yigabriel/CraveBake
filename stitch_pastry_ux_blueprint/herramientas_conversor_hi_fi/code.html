<body class="bg-background text-on-background min-h-screen flex flex-col pb-safe">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-gutter w-full h-16 bg-surface shadow-sm docked full-width top-0 z-50">

<button class="text-primary hover:bg-surface-container-high transition-colors duration-200 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-lg pb-32">
<div class="w-full max-w-2xl bg-surface-container rounded-xl shadow-[0_4px_20px_rgba(154,68,45,0.1)] p-md md:p-lg flex flex-col gap-lg">
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-base">Measurement Converter</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Precision baking starts here.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Left Side: Inputs -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="ingredient">Ingredient</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline/20 rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary appearance-none outline-none transition-colors" id="ingredient">
<option value="flour">All-Purpose Flour</option>
<option value="sugar">Granulated Sugar</option>
<option value="butter">Butter</option>
<option value="cocoa">Cocoa Powder</option>
<option value="water">Water / Milk</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="value">Amount</label>
<input class="w-full bg-surface-bright border border-outline/20 rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="value" min="0" step="0.1" type="number" value="1">
</div>
<div class="grid grid-cols-2 gap-sm">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="fromUnit">From</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline/20 rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary appearance-none outline-none transition-colors" id="fromUnit">
<option value="cups">Cups</option>
<option value="tbsp">Tablespoons</option>
<option value="tsp">Teaspoons</option>
<option value="grams">Grams</option>
<option value="oz">Ounces</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="toUnit">To</label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline/20 rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary appearance-none outline-none transition-colors" id="toUnit">
<option value="grams">Grams</option>
<option value="cups">Cups</option>
<option value="tbsp">Tablespoons</option>
<option value="oz">Ounces</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-sm">expand_more</span>
</div>
</div>
</div>
</div>

<div class="flex flex-col items-center justify-center bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-outline-variant/30 text-center relative group">

<div class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary" id="resultDisplay">
                        120 g
                    </div>

<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
