<style>
        body { background-color: #fff8f6; }
        .timer-ring { stroke-dasharray: 283; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified for Prep Mode - Linear Flow, Hide global nav) -->
<header class="flex justify-between items-center px-gutter w-full h-16 bg-surface shadow-sm sticky top-0 z-50">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex-1 px-4">
<div class="flex justify-between items-center mb-1">
<span class="font-label-md text-label-md text-on-surface-variant">Step 3 of 8</span>
<span class="font-label-md text-label-md text-primary">37%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5 overflow-hidden">
<div class="bg-primary h-1.5 rounded-full" style="width: 37%"></div>
</div>
</div>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-lg max-w-4xl mx-auto w-full">
<!-- Technique Image / Illustration -->
<div class="w-full aspect-[4/3] md:aspect-video rounded-xl overflow-hidden shadow-sm mb-lg bg-surface-container-high relative flex-shrink-0 max-h-[442px]">
<img class="w-full h-full object-cover" data-alt="A high-quality, top-down photograph of a baker performing the French kneading technique (Amasado Francés) on a rustic wooden surface. Hands are shown stretching the wet dough upwards, creating a smooth, glossy surface. Warm, diffused editorial lighting highlighting the texture of the flour and butter. Minimalist aesthetic with subtle apricot and peach tones in the background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9rY6Pdj22NLq0ehlcJ9QuEhNQp6mk4lrouxYfreayK0Q4dKywasnYxRT062eqdd0eOIY_1az4oYn8FzByhK8Pd1ZTltrQNu2Qga80LOO1tne2RuB3MRXyzcDlUdfxNMmUZ3O7T5oRK2LhqSwnDP0M4BHJ5LhFriv07ZuaFY6zGQK4th2d8F9B0DkpFZwlgM34k-f7ipaTyPgo2mWVs54u3bi8bi86SxW5264ncYstBfLGnXLoL9ji">
</div>
<!-- Step Content -->
<div class="flex flex-col items-center text-center max-w-2xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-background mb-md">
                Amasado Francés
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
                Lift the dough, stretch it upwards, and fold it over itself to trap air. This wet technique develops gluten rapidly without adding extra flour. Repeat rhythmically for the duration of the timer.
            </p>
</div>
<!-- Timer Section -->
<div class="relative w-48 h-48 mb-xl flex items-center justify-center">
<!-- Circular Progress -->
<svg class="w-full h-full transform -rotate-90 absolute inset-0" viewBox="0 0 100 100">
<!-- Background track -->
<circle class="text-surface-variant" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="4"></circle>
<!-- Progress ring (Muted Teal via tertiary container) -->
<circle class="text-tertiary-container timer-ring" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="flex flex-col items-center z-10">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2">15:00</span>
<button class="bg-primary hover:bg-primary-container hover:text-on-primary-container text-on-primary rounded-full p-3 shadow-md hover:shadow-lg transition-all active:scale-95">
<span class="material-symbols-outlined text-3xl" data-icon="play_arrow" data-weight="fill">play_arrow</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Bar (Overrides BottomNav for Linear flow) -->
<footer class="w-full bg-surface border-t border-outline-variant p-4 flex justify-between items-center z-50 shadow-[0_-4px_20px_rgba(154,68,45,0.05)] pb-safe">
<button class="flex items-center gap-2 px-6 py-3 rounded-lg border border-outline hover:bg-surface-container-high transition-colors font-label-md text-label-md text-on-surface active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            Previous

<button class="flex items-center gap-2 px-8 py-3 rounded-lg bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container hover:shadow-md transition-all font-label-md text-label-md active:scale-95">
            Next
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
